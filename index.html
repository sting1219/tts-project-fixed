<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 텍스트 음성 변환기 (TTS) - 무료 멀티 버전</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full border border-slate-100">
            <h1 class="text-2xl font-bold text-center mb-2 text-indigo-600">무료 다중 TTS 변환기</h1>
            <p class="text-sm text-slate-500 text-center mb-6">목소리 종류를 변경하여 다양한 버전으로 들어보세요.</p>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">변환할 텍스트</label>
                    <textarea id="textInput" rows="5" maxlength="300" 
                        class="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-none"
                        placeholder="목소리로 바꿀 내용을 입력하세요..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">무료 스타일 선택 (목소리 교체 가능)</label>
                    <select id="voiceSelect" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white transition">
                        <option value="sunhi">스타일 A (한국어 표준 여성 톤)</option>
                        <option value="injoon">스타일 B (글로벌 샤프 남성 톤)</option>
                        <option value="jiyeun">스타일 C (유럽풍 하이 여성 톤)</option>
                        <option value="hyunsu">스타일 D (클래식 딥 젠틀 톤)</option>
                    </select>
                </div>

                <div class="bg-slate-100 h-20 flex items-center justify-center rounded-xl border border-dashed border-slate-300 my-2">
                    <span class="text-xs text-slate-400">[이곳에 에드센스 광고 코드가 들어갑니다]</span>
                </div>

                <button id="submitBtn" onclick="generateTTS()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-4 px-6 rounded-xl transition duration-200 flex items-center justify-center space-x-2 cursor-pointer shadow-md shadow-indigo-100">
                    <span id="btnText">음성 생성하기</span>
                    <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>

                <div id="audioPlayerContainer" class="hidden mt-4 p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-4">
                    <p class="text-xs font-semibold text-slate-500 flex items-center">
                        <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-2"></span> 생성 완료! 미리 들어보세요
                    </p>
                    <audio id="audioPlayer" controls class="w-full"></audio>
                    <a id="downloadBtn" href="#" download="" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 flex items-center justify-center text-sm shadow-sm">
                        📥 MP3 파일 다운로드
                    </a>
                </div>

            </div>
        </div>
    </main>

    <script>
        let currentAudioUrl = null;

        async function generateTTS() {
            const textInput = document.getElementById('textInput');
            const voiceSelect = document.getElementById('voiceSelect');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            
            const audioPlayerContainer = document.getElementById('audioPlayerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadBtn = document.getElementById('downloadBtn');

            const text = textInput.value.trim();
            const voice = voiceSelect.value;

            if (!text) {
                alert('텍스트를 입력해 주세요!');
                return;
            }

            audioPlayerContainer.classList.add('hidden');

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.innerText = '오디오 생성 중...';
            spinner.classList.remove('hidden');

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice })
                });

                if (!response.ok) {
                    throw new Error('음성 생성에 실패했습니다.');
                }

                const blob = await response.blob();
                
                if (currentAudioUrl) {
                    window.URL.revokeObjectURL(currentAudioUrl);
                }

                currentAudioUrl = window.URL.createObjectURL(blob);
                
                audioPlayer.src = currentAudioUrl;
                downloadBtn.href = currentAudioUrl;
                downloadBtn.download = `free_voice_${voice}_${Date.now()}.mp3`;

                audioPlayerContainer.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert(`오류 발생: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.innerText = '음성 생성하기';
                spinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
